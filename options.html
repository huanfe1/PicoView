<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PicoView 设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="title">
          <h1>PicoView 设置</h1>
          <p>配置 PicoView 图片查看器的外观呈现、鼠标交互与快捷键偏好，修改将自动保存。</p>
        </div>
        <div class="actions">
          <p id="status" role="status"></p>
          <button id="reset" type="button" class="ghost">恢复默认设置</button>
        </div>
      </div>
    </header>

    <main>
      <form id="settings">
        <section class="card" aria-labelledby="h-display">
          <h2 id="h-display">外观与视图</h2>

          <div class="row">
            <label class="text" for="backgroundMode">
              <span class="name">背景样式</span>
              <span class="hint">选择视口底色效果或当前图片虚化背景</span>
            </label>
            <select id="backgroundMode" name="backgroundMode"><button><selectedcontent></selectedcontent></button></select>
          </div>

          <div class="row">
            <label class="text" for="backgroundColor">
              <span class="name">常规图片背景色</span>
              <span class="hint">适用于 JPG、PNG、WebP 等位图格式背后的底色</span>
            </label>
            <input id="backgroundColor" name="backgroundColor" type="color">
          </div>

          <div class="row">
            <label class="text" for="backgroundColorSvg">
              <span class="name">SVG 矢量图背景色</span>
              <span class="hint">独立设置 SVG 底色，便于清晰辨识透明图案</span>
            </label>
            <input id="backgroundColorSvg" name="backgroundColorSvg" type="color">
          </div>

          <div class="row">
            <label class="text" for="startZoom">
              <span class="name">初始缩放模式</span>
              <span class="hint">新打开图片时默认采用的显示比例</span>
            </label>
            <select id="startZoom" name="startZoom"><button><selectedcontent></selectedcontent></button></select>
          </div>

          <div class="row">
            <label class="text" for="position">
              <span class="name">初始对齐位置</span>
              <span class="hint">图片未占满视口或初始加载时的定位锚点</span>
            </label>
            <select id="position" name="position"><button><selectedcontent></selectedcontent></button></select>
          </div>

          <label class="row">
            <span class="text">
              <span class="name">平滑动画过渡</span>
              <span class="hint">在缩放、旋转或对齐切换时提供平滑视觉过渡</span>
            </span>
            <input name="smooth" type="checkbox" role="switch">
          </label>

          <label class="row">
            <span class="text">
              <span class="name">拖拽平移限制在窗口内</span>
              <span class="hint">拖拽平移时防止图片完全移出可视区域</span>
            </span>
            <input name="keepInside" type="checkbox" role="switch">
          </label>

          <label class="row">
            <span class="text">
              <span class="name">点击空白背景退出查看</span>
              <span class="hint">单击图片外围空白区域时退出查看器或关闭页面</span>
            </span>
            <input name="closeOnBackgroundClick" type="checkbox" role="switch">
          </label>
        </section>

        <section class="card" aria-labelledby="h-controls">
          <h2 id="h-controls">操作与交互</h2>

          <div class="row">
            <label class="text" for="controls">
              <span class="name">滚轮默认模式</span>
              <span class="hint">鼠标滚轮默认行为（操作时按住 Ctrl 可切换另一行为）</span>
            </label>
            <select id="controls" name="controls"><button><selectedcontent></selectedcontent></button></select>
          </div>

          <label class="row">
            <span class="text">
              <span class="name">反转滚轮缩放方向</span>
              <span class="hint">对调滚轮向上/向下滚动时的放大与缩小逻辑</span>
            </span>
            <input name="invertZoom" type="checkbox" role="switch">
          </label>

          <label class="row">
            <span class="text">
              <span class="name">反转垂直平移方向</span>
              <span class="hint">反转上下拖拽或垂直滚动时的平移方向</span>
            </span>
            <input name="invertVertical" type="checkbox" role="switch">
          </label>

          <label class="row">
            <span class="text">
              <span class="name">反转水平平移方向</span>
              <span class="hint">反转按住 Shift 滚轮滚动或水平拖拽时的平移方向</span>
            </span>
            <input name="invertHorizontal" type="checkbox" role="switch">
          </label>

          <label class="row">
            <span class="text">
              <span class="name">反转滚轮旋转方向</span>
              <span class="hint">反转按住 Alt 滚轮旋转图片时的顺时针/逆时针方向</span>
            </span>
            <input name="invertRotate" type="checkbox" role="switch">
          </label>

          <label class="row">
            <span class="text">
              <span class="name">网页图片右键菜单项</span>
              <span class="hint">在网页图片的右键菜单中显示“在当前标签页打开图片”</span>
            </span>
            <input name="openInCurrentTab" type="checkbox" role="switch">
          </label>
        </section>

        <section class="card" aria-labelledby="h-keys">
          <h2 id="h-keys">键盘快捷键</h2>
          <p class="section-hint">点击按键即可开始录制，按下目标键完成绑定；右键点击对应项可清除快捷键。</p>
          <div id="keys"></div>
        </section>
      </form>
    </main>
    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
