name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set node
        uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org/
          node-version: 24

      - name: Pack extension
        run: |
          tag="${GITHUB_REF_NAME}"
          rm -rf dist
          mkdir -p dist/PicoView
          cp -a src/. dist/PicoView/
          (
            cd dist
            zip -r "PicoView-${tag}.zip" PicoView
          )

      - run: npx changelogithub --assets "dist/*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
